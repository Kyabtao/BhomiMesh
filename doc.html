<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Viewer — BhoomiMesh ($BMCM)</title>
<meta name="description" content="Read any BhoomiMesh specification document in the unified site chrome.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8E%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind.config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="font-sans text-slate-200 antialiased selection:bg-emerald-500/30">

<div id="siteNav"></div>

<!-- ============ DOC CHROME ============ -->
<header class="bg-grid border-b border-slate-800/70">
  <div class="mx-auto max-w-5xl px-4 py-8 sm:px-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <a href="documents.html" class="text-xs font-semibold text-slate-500 transition hover:text-emerald-300">
        <i class="fa-solid fa-arrow-left mr-1.5"></i>Back to Documents
      </a>
      <div id="docBadges" class="flex flex-wrap items-center gap-2"></div>
    </div>
    <div id="docHeading" class="mt-5"></div>
    <div id="docNav" class="mt-6 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500">
      <span id="docCount"></span>
      <div class="flex items-center gap-2">
        <label for="docJump" class="font-semibold text-slate-400">Jump to doc:</label>
        <select id="docJump" class="rounded-lg border border-slate-700 bg-slate-900/80 px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-emerald-500/60"></select>
      </div>
    </div>
  </div>
</header>

<!-- ============ DOC BODY ============ -->
<main class="mx-auto max-w-5xl px-4 py-10 sm:px-6">
  <article id="docBody" class="doc-styles"></article>

  <nav id="docPager" class="mt-12 grid grid-cols-1 gap-3 sm:grid-cols-2"></nav>
</main>

<div id="siteFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/data-docs.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages/doc.js"></script>
</body>
</html>
